version: "3.9"

services:
  predobdelava:
    build:
      context: .
      dockerfile: Dockerfile.predobdelava
    container_name: face2fa-predobdelava
    volumes:
      - ./:/app
    command: ["python", "predobdelava.py"]
    profiles: ["tools"]
    restart: "no"

  api:
    build:
      context: ./api
    container_name: face2fa-api
    ports:
      - "8000:8000"
    volumes:
      - ./api/model:/app/model:ro
    environment:
      - MODEL_PATH=model/resnet18_prepoznava_obrazov.pth
      - AUTH_THRESHOLD=0.80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
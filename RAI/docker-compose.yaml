version: "3.9"

services:
    baza-mongo: 
        image: mongo:latest
        container_name: paketnik_baza
        ports: 
            - "27017:27017"
        volumes:
            - mongo_data:/data/db
        restart: unless-stopped

    backend: 
        build: 
            context: ./backend
        container_name: paketnik_api
        ports: 
            - "3000:3000"
        depends_on:
            - baza-mongo
        restart: unless-stopped

    frontend: 
        build: 
            context: ./frontend
        container_name: paketnik_frontend
        ports: 
            - "3001:3001"
        depends_on:
            - backend
        restart: unless-stopped
volumes:
    mongo_data: